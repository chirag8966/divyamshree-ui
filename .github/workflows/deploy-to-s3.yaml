name: deploy divyamshree-ui to s3

on:
  push:
    branches: [main]

env:
  BUCKET_NAME: "divyamshree.com"
  AWS_REGION: "us-east-1"
  AWS_CLOUDFRONT_DISTRIBUTION_ID: "EXHTZ90J6I453"
  AWS_ACCOUNT_ID: "858098074775"

permissions:
  id-token: write
  contents: read

jobs:
  S3PackageUpload:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubS3Access
          role-session-name: GitHubActions
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Sync files to S3 bucket
        run: |
          aws s3 sync ./dist s3://${{ env.BUCKET_NAME }}/ --delete

      - name: cache invalidation
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
