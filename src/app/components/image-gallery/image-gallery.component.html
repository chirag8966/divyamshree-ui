<section class="image-gallery">
  <div class="gallery-container">
    <h2 class="gallery-title">Experience the Richness</h2>
    <p class="gallery-subtitle">Premium cold coffee that awakens your senses</p>
    
    <div class="gallery-grid">
      @for (image of images; track image.src) {
        <div class="gallery-item">
          <div class="image-wrapper">
            <img [ngSrc]="image.src" [alt]="image.alt" width="400" height="200" loading="eager">
            <div class="image-overlay">
              <h3 class="image-title">{{ image.title }}</h3>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
